<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Arrepentómetro</title>
<style>
  :root{
    --bg:#0b0b12; --card:#15151f; --text:#f4f4f8; --muted:#8b8ba0;
    --accent:#ff3b4e; --lvl:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(600px 400px at 50% -10%,color-mix(in srgb,var(--lvl) 25%,transparent),transparent 70%);
    transition:background .6s}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;gap:20px}
  .screen.active{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .logo{font-size:84px;filter:drop-shadow(0 0 24px rgba(255,59,78,.5));animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{font-size:2rem;letter-spacing:.04em;font-weight:900}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);max-width:300px;line-height:1.5}
  .btn{border:0;border-radius:18px;padding:18px 28px;font-size:1.05rem;font-weight:800;letter-spacing:.05em;
    color:#fff;background:linear-gradient(135deg,#ff3b4e,#ff7a3b);width:100%;max-width:340px;cursor:pointer;
    box-shadow:0 10px 30px rgba(255,59,78,.4);transition:transform .15s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;border:2px solid #2a2a3a;box-shadow:none;color:var(--muted);font-size:.9rem;padding:14px}
  .tiny{color:var(--muted);font-size:.75rem}

  /* Análisis */
  .preview{width:180px;height:180px;border-radius:28px;object-fit:cover;border:3px solid #2a2a3a;position:relative}
  .scan{position:relative;width:180px;height:180px;border-radius:28px;overflow:hidden}
  .scan img{width:100%;height:100%;object-fit:cover}
  .scan::after{content:"";position:absolute;left:0;right:0;height:4px;background:var(--accent);
    box-shadow:0 0 18px 6px rgba(255,59,78,.7);animation:scan 1.4s ease-in-out infinite}
  @keyframes scan{0%{top:0}50%{top:calc(100% - 4px)}100%{top:0}}
  .step{font-size:1.15rem;font-weight:700;min-height:1.6em}
  .bar{width:100%;max-width:300px;height:8px;background:#22222f;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b4e,#ffd23f);transition:width .4s}

  /* Resultado */
  #result.active{animation:shake .6s}
  @keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(7px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
  .alert{font-size:.8rem;letter-spacing:.3em;font-weight:900;color:var(--lvl);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.35}}
  .prod{font-size:1.2rem;font-weight:700}
  .pct{font-size:6.5rem;font-weight:900;line-height:1;color:var(--lvl);text-shadow:0 0 40px var(--lvl)}
  .idx{font-size:.8rem;letter-spacing:.2em;color:var(--muted)}
  .meter{width:100%;max-width:320px;height:18px;background:#22222f;border-radius:99px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--lvl);box-shadow:0 0 20px var(--lvl);
    border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .level{font-weight:900;letter-spacing:.08em;color:var(--lvl);font-size:1.1rem}
  .quote{max-width:320px;line-height:1.5;font-size:1.05rem;font-style:italic;background:var(--card);
    padding:16px 18px;border-radius:18px;border-left:4px solid var(--lvl)}
  .thumb{width:64px;height:64px;border-radius:16px;object-fit:cover;border:2px solid var(--lvl)}
  .row{display:flex;gap:14px;align-items:center}
  .flash{position:fixed;inset:0;background:var(--lvl);opacity:0;pointer-events:none}
  .flash.go{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}
  .hidden{display:none}
  #result{overflow-y:auto;justify-content:flex-start;gap:16px}
  #result > :first-child{margin-top:auto}
  #result > :last-child{margin-bottom:auto}
  .eco{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:320px;padding-bottom:12px}
  .eco p{font-size:.85rem;line-height:1.4;color:#9fdc9f;font-weight:600}
  .eco img{width:110px;height:auto;filter:drop-shadow(0 0 18px rgba(80,200,120,.45));animation:float 4s ease-in-out infinite}
  .logos{display:flex;gap:22px;align-items:center;justify-content:center;margin-top:6px}
  .logos img{height:44px;width:auto;opacity:.9}
  .credit{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));
    text-align:center;font-size:.68rem;color:#6b6b7b;letter-spacing:.04em;pointer-events:none}
</style>
</head>
<body>
<div class="flash" id="flash"></div>

<!-- INICIO -->
<section class="screen active" id="home">
  <div class="logo">🔮</div>
  <h1>ARREPENTÓ<span>METRO</span></h1>
  <p class="sub">Fotografía lo que quieres comprar y calcularemos cuánto te vas a arrepentir.</p>
  <button class="btn" id="btnPick">📸 ANALIZAR MI COMPRA</button>
  <p class="tiny">Tecnología avanzada para llegar siempre a la misma conclusión.</p>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileGallery" accept="image/*" hidden>
  <button class="btn ghost" id="btnGallery">🖼️ Elegir de la galería</button>
  <div class="logos">
    <img src="assets/logo-sc.png" alt="Stephanie Cruz Guzman">
    <img src="assets/logo-umb.webp" alt="Universidad Manuela Beltrán">
  </div>
  <div class="credit">Stephanie Cruz Guzman ® | UMB</div>
</section>

<!-- ANALIZANDO -->
<section class="screen" id="loading">
  <div class="scan"><img id="scanImg" alt=""></div>
  <div class="step" id="step">Analizando…</div>
  <div class="bar"><i id="barFill"></i></div>
  <p class="tiny" id="vars">Procesando 47 variables…</p>
</section>

<!-- RESULTADO -->
<section class="screen" id="result">
  <div class="alert">🚨 ALERTA 🚨</div>
  <div class="row"><img class="thumb" id="thumb" alt=""><div class="prod" id="prod"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="idx">ÍNDICE DE ARREPENTIMIENTO</div>
  <div class="meter"><i id="meterFill"></i></div>
  <div class="level" id="level"></div>
  <div class="quote" id="quote"></div>
  <button class="btn" id="btnAgain">ANALIZAR OTRA COMPRA</button>
  <div class="eco">
    <p id="ecoText"></p>
    <img src="assets/planeta.png" alt="Planeta">
  </div>
</section>

<script>
const GENERAL = [
  "¿En verdad necesitas esto?",
  "Tu yo del futuro te está pidiendo que no lo compres.",
  "Es mejor ahorrar.",
  "El descuento no significa que lo necesites.",
  "Tu cuenta bancaria no está de acuerdo.",
  "Piénsalo otra vez.",
  "Puedes vivir sin esto.",
  "Tu dinero merece una segunda oportunidad.",
  "¿Y si mejor no?",
  "Probablemente ya tienes algo parecido.",
  "¿Seguro que esto no puede esperar?",
  "Tu bolsillo acaba de decir que no.",
  "No comprar también es una opción.",
  "Tal vez no lo necesitas tanto como crees.",
  "Antes de comprar, mira lo que ya tienes.",
  "Ese dinero podría quedarse contigo.",
  "¿Necesidad o simple antojo?",
  "No todo lo que te gusta tienes que comprarlo.",
  "Tu carrito puede sobrevivir sin esto.",
  "Piénsalo antes de pagar.",
  "Quizás mañana ya no lo quieras.",
  "El impulso no siempre sabe lo que necesitas.",
  "¿Lo necesitas o simplemente lo quieres?",
  "Tu futuro yo agradecerá esos ahorros.",
  "Puedes cerrar la aplicación y seguir con tu vida.",
  "No comprarlo también cuenta como una buena decisión.",
  "Tal vez tu casa ya tiene suficiente.",
  "Tu dinero tiene mejores planes.",
  "Esto puede esperar. Tu dinero también quiere descansar.",
  "No necesitas una razón para no comprarlo.",
  "Si tienes dudas, quizá ya tienes la respuesta.",
  "Tu yo del futuro podría agradecerte este momento.",
  "Un minuto de emoción, meses ocupando espacio.",
  "¿Realmente vale la pena llevártelo?"
];
const ABSURD = [
  "Tu gato tampoco aprobaría esta compra.",
  "Hemos consultado al futuro y no le gustó.",
  "Tu billetera acaba de pedir ayuda.",
  "Esta compra ha sido desaprobada por el comité de ahorro.",
  "El universo recomienda esperar.",
  "No tenemos pruebas, pero tampoco dudas.",
  "Tu gato fue consultado y se abstuvo de responder.",
  "Una ardilla acaba de recomendar que ahorres.",
  "El comité internacional de compras innecesarias votó en contra.",
  "Tu planta tampoco cree que sea necesario.",
  "Hemos preguntado a tres expertos. Ninguno existe.",
  "El algoritmo dice que no. El algoritmo no explica por qué.",
  "Un señor en internet recomienda no comprarlo.",
  "El universo está ocupado, pero dice que esperes.",
  "Tu billetera ha solicitado representación legal.",
  "Tu tarjeta acaba de mirar hacia otro lado.",
  "El departamento de decisiones cuestionables recomienda cancelar.",
  "Hemos detectado una cantidad preocupante de ganas de comprar.",
  "La ciencia no puede explicarlo, pero no deberías comprarlo.",
  "Tu yo de otra dimensión tampoco lo compraría.",
  "Una paloma acaba de desaprobar esta compra.",
  "El comité de gastos innecesarios ha abierto una investigación.",
  "Tu cuenta bancaria necesita un abrazo.",
  "El producto parece inocente. Tu saldo no.",
  "Hemos simulado tu futuro. Hay arrepentimiento.",
  "No sabemos por qué, pero esto huele a arrepentimiento.",
  "El Consejo Supremo de las Compras Dudosas dice: NO.",
  "Tu billetera acaba de poner esta compra en lista negra.",
  "La inteligencia artificial recomienda usar la inteligencia humana.",
  "El universo tiene dudas. Nosotros también.",
  "Se detectó una fuerte presencia de compra impulsiva.",
  "Esta compra no pasó la prueba del sentido común.",
  "El producto preguntó por qué lo querías. No supimos qué responder.",
  "Tu futuro financiero acaba de cerrar sesión.",
  "El planeta, tu billetera y tu sentido común están en una reunión.",
  "Hemos encontrado una solución: no comprarlo.",
  "El planeta acaba de poner esta compra en espera.",
  "Un árbol imaginario acaba de caer.",
  "El planeta no sabe qué es esto, pero tampoco lo pidió.",
  "Tu compra tiene huella. Mejor que no deje otra.",
  "El planeta recomienda conservar los recursos… y tu dinero.",
  "La Tierra tiene suficientes cosas. Gracias por preguntar.",
  "Otro producto, otro futuro residuo.",
  "El planeta votó. El resultado fue: piensa otra vez.",
  "La naturaleza acaba de mirar tu carrito con preocupación.",
  "Este producto quiere entrar a tu casa. El planeta dice que no.",
  "Hemos detectado un posible futuro residuo.",
  "El planeta no necesita otra compra impulsiva.",
  "Tu bolsillo y la Tierra forman una alianza temporal.",
  "Menos compras. Menos residuos. Menos arrepentimiento.",
  "El planeta recomienda: déjalo donde lo encontraste.",
  "La Tierra sobrevivirá sin esto. Tú probablemente también.",
  "El planeta acaba de solicitar que cierres el carrito.",
  "No sabemos cuánto lo usarás, pero sabemos que algún día será residuo.",
  "Compra detectada. Necesidad ambiental: no encontrada.",
  "El planeta agradece que lo hayas pensado. Ahora no lo compres."
];
// Frases ecológicas que aparecen encima de la imagen del planeta.
const ECO = [
  "El planeta puede vivir sin esta compra. Tú también.",
  "Tu bolsillo y el planeta te piden pensarlo dos veces.",
  "Menos compras impulsivas, más planeta.",
  "Tu próxima compra también tiene un impacto.",
  "Quizás ya tienes algo que cumple la misma función.",
  "El mejor residuo es el que nunca generaste.",
  "No sabemos si lo necesitas, pero el planeta recomienda esperar.",
  "Tu cuenta bancaria y el planeta están de acuerdo: piénsalo.",
  "El planeta no pidió otro.",
  "El descuento termina. El residuo se queda.",
  "Tu yo del futuro quizá no quiera este producto. El planeta tampoco.",
  "El planeta ha solicitado que reconsideres esta compra.",
  "¿Seguro que quieres convertir esto en un futuro residuo?",
  "Tu dinero quería quedarse contigo. El planeta también.",
  "Lo que no compras también es una forma de cuidar el planeta.",
  "Cada compra tiene una huella. ¿Vale la pena dejarla?",
  "Antes de comprar algo nuevo, piensa en todo lo que ya tienes.",
  "Menos consumo, menos residuos, más planeta.",
  "El planeta no necesita que tengas más. Necesita que desperdicies menos.",
  "Cada producto que compras algún día será un residuo.",
  "Lo barato puede costarle caro al planeta.",
  "No todo lo que necesitas comprar necesitas tener.",
  "Comprar menos también es consumir responsablemente.",
  "Antes de comprar, piensa en lo que quedará cuando dejes de usarlo.",
  "Tu compra dura un tiempo. Su impacto puede durar mucho más.",
  "El planeta también paga por nuestras compras.",
  "Una compra innecesaria es un residuo esperando su momento.",
  "Si ya tienes algo que funciona, quizá no necesitas otro.",
  "La mejor compra para el planeta puede ser no comprar.",
  "Antes de añadir algo a tu carrito, piensa qué estás añadiendo al planeta.",
  "Tu consumo deja huella. Procura que no sea innecesaria.",
  "Cada cosa que compras necesita recursos para existir.",
  "No necesitas comprar más para vivir mejor.",
  "El planeta tiene recursos limitados. Tus compras también deberían tener límites."
];
const UNKNOWN = ["No sabemos qué es, pero probablemente tampoco lo necesitabas."];
const STEPS = [
  "🔍 Analizando necesidad…",
  "💰 Evaluando impacto financiero…",
  "🌱 Evaluando impacto de consumo…",
  "📊 Procesando 47 variables…",
  "🧠 Consultando tu futuro…"
];
const LEVELS = [
  { min:99, name:"💀 ARREPENTIMIENTO CRÍTICO", color:"#b517ff", tag:"¿QUÉ ESTÁS HACIENDO?" },
  { min:95, name:"🔴 ARREPENTIMIENTO EXTREMO", color:"#ff3b4e", tag:"NO LO COMPRES." },
  { min:90, name:"🟠 ARREPENTIMIENTO MUY ALTO", color:"#ff8a3b", tag:"Probablemente vas a arrepentirte." },
  { min:85, name:"🟡 ARREPENTIMIENTO ALTO", color:"#ffd23f", tag:"Piénsalo un poquito más." }
];

const $ = id => document.getElementById(id);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const show = id => { document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); };
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// La regla fundamental: siempre entre 85 y 100.
const calcularArrepentimiento = () => rand(85,100);
const obtenerNivel = i => LEVELS.find(l => i >= l.min);

// Reduce la imagen para que la subida sea rápida.
function resizeImage(file, max=800){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function identify(dataUrl){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 26000);
    const r = await fetch("/api/identify",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image: dataUrl.split(",")[1] }), signal: ctrl.signal
    });
    clearTimeout(t);
    const j = await r.json();
    return j.product || "Producto desconocido";
  }catch(e){ return "Producto desconocido"; }
}

async function analyze(file){
  if(!file) return;
  let dataUrl;
  try{ dataUrl = await resizeImage(file); }catch(e){ return; }
  $("scanImg").src = dataUrl;
  $("barFill").style.width = "0";
  show("loading");

  // La IA identifica mientras corre la animación teatral.
  const productPromise = identify(dataUrl);
  const animation = (async()=>{
    for(let i=0;i<STEPS.length;i++){
      $("step").textContent = STEPS[i];
      $("barFill").style.width = ((i+1)/STEPS.length*100)+"%";
      await sleep(900);
    }
  })();
  const [product] = await Promise.all([productPromise, animation]);

  const unknown = /desconocido/i.test(product);
  const idx = calcularArrepentimiento();
  const lvl = obtenerNivel(idx);
  const phrase = unknown ? pick(UNKNOWN) : pick([...GENERAL, ...ABSURD]);

  document.documentElement.style.setProperty("--lvl", lvl.color);
  $("thumb").src = dataUrl;
  $("prod").textContent = product;
  $("level").textContent = lvl.name;
  $("quote").innerHTML = `“${phrase}”<br><b style="font-style:normal;font-size:.85rem;color:${lvl.color}">${lvl.tag}</b>`;
  $("ecoText").textContent = pick(ECO);
  $("pct").textContent = "0%";
  $("meterFill").style.width = "0";
  show("result");
  $("result").scrollTop = 0;

  const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);

  // Contador animado
  const start = performance.now();
  const tick = now => {
    const p = Math.min(1,(now-start)/1400);
    $("pct").textContent = Math.round(idx*p)+"%";
    if(p<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  requestAnimationFrame(()=>{ $("meterFill").style.width = idx+"%"; });
}

$("btnPick").onclick = () => $("file").click();
$("btnGallery").onclick = () => $("fileGallery").click();
$("file").onchange = e => { analyze(e.target.files[0]); e.target.value=""; };
$("fileGallery").onchange = e => { analyze(e.target.files[0]); e.target.value=""; };
$("btnAgain").onclick = () => { document.documentElement.style.setProperty("--lvl","#ffd23f"); show("home"); };
</script>
</body>
</html>
